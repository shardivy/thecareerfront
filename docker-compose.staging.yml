version: "3.9"

services:

  backend:
    build: ./backend
    container_name: staging_backend
    env_file:
      - ./env/backend.env
    ports:
      - "8001:8000"
    depends_on:
      - db
      - redis
    restart: always

  frontend:
    build: ./frontend
    container_name: staging_frontend
    ports:
      - "3001:3000"
    restart: always

  db:
    image: mysql:8.0
    container_name: staging_mysql
    restart: always
    environment:
      MYSQL_DATABASE: mydb
      MYSQL_USER: myuser
      MYSQL_PASSWORD: mypassword
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - staging_mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: staging_redis
    restart: always

  celery:
    build: ./backend
    container_name: staging_celery
    command: celery -A backend worker --loglevel=info
    env_file:
      - ./env/backend.env
    depends_on:
      - redis
      - db
    restart: always

volumes:
  staging_mysql_data:
